name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Arrange project
        run: |
          mkdir -p app/src/main/java/com/example/cfscanner
          mv MainActivity.kt app/src/main/java/com/example/cfscanner/
          mv AndroidManifest.xml app/src/main/
          mv app-build.gradle.kts app/build.gradle.kts
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CF-Scanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
