name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "v=2.0" >> "$GITHUB_OUTPUT"; fi
      - name: Arrange project
        run: bash arrange.sh
      - run: gradle assembleDebug --no-daemon -PappVersion=${{ steps.ver.outputs.v }} -PappCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: Parvane-Scanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Parvane-Scanner-${GITHUB_REF_NAME}.apk"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Parvane Scanner $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "Parvane-Scanner-${GITHUB_REF_NAME}.apk" --clobber
          
